name: Build installers

# Runs on every push to the app's branch, manually from the Actions tab, or when a version tag like v0.2.0 is pushed.
on:
  workflow_dispatch:
  push:
    branches: ['claude/practical-goodall-gzwdz9', 'main']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Mac build ships both Apple Silicon and Intel apps; the runner only installs the
      # image engine for its own chip, so add the Intel one too.
      - name: Add Intel Mac image engine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          v=$(node -p "require('sharp/package.json').optionalDependencies['@img/sharp-darwin-x64']")
          l=$(node -p "require('sharp/package.json').optionalDependencies['@img/sharp-libvips-darwin-x64']")
          npm install --no-save --force "@img/sharp-darwin-x64@$v" "@img/sharp-libvips-darwin-x64@$l"

      - run: npm run typecheck

      - name: Test every tool
        run: npm run smoke

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          # Personal build: no paid code-signing certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Squeeze-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  # Publish the installers as a GitHub Release so the README links always point at the newest build.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Read version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Squeeze ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            Download the installer for your computer:
            - **Windows:** Squeeze-Setup.exe
            - **Mac with Apple Silicon (M1–M4):** Squeeze-mac-arm64.dmg
            - **Mac with Intel chip:** Squeeze-mac-x64.dmg
          files: installers/*
