appId: com.aerowis.compressor
productName: Aerowis Compressor
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,test,tests,__tests__,docs,example,examples}'
# Native image engine and the WebAssembly engines are loaded from disk, so keep them outside the asar archive.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
  - '**/node_modules/@jspawn/ghostscript-wasm/**'
  - '**/node_modules/@neslinesli93/qpdf-wasm/**'
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Fixed names (no version) so the README's "latest" download links never change.
  artifactName: Aerowis-Compressor-Setup.${ext}
  shortcutName: ${productName}
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: Aerowis-Compressor-mac-${arch}.${ext}
  # Free ad-hoc signature: Apple Silicon Macs refuse to run completely unsigned apps.
  identity: '-'
  hardenedRuntime: false
